name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Find and Extract ZIP
        run: |
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Found ZIP file: $ZIP_NAME"
          unzip -o "$ZIP_NAME" -d temp_extracted

          INNER_DIR=$(find temp_extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -n "$INNER_DIR" ]; then
            cp -rn "$INNER_DIR"/* . || true
            cp -rn "$INNER_DIR"/.* . 2>/dev/null || true
          else
            cp -rn temp_extracted/* . || true
            cp -rn temp_extracted/.* . 2>/dev/null || true
          fi

          rm -rf temp_extracted "$ZIP_NAME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Error: gradlew file missing in ZIP!"
            ls -la
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
