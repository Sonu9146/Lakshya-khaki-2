name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP Properly
        run: |
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Extracting: $ZIP_NAME"
          unzip -o "$ZIP_NAME" -d extracted
          
          # जर ZIP च्या आत पुन्हा मुख्य प्रोजेक्ट फोल्डर असेल तर
          if [ -f "extracted/build.gradle.kts" ] || [ -f "extracted/build.gradle" ]; then
            cp -rn extracted/* . || true
          else
            # सब-फोल्डर शोधून रूटला आणणे
            PROJ_DIR=$(find extracted -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
            if [ -n "$PROJ_DIR" ]; then
              cp -rn "$PROJ_DIR"/* . || true
            fi
          fi
          
          # जर gradlew फाईल नसेल तर Gradle Wrapper तयार करणे
          if [ ! -f "./gradlew" ]; then
            echo "Gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
